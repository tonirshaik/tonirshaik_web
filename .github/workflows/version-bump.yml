name: Automatically bump website version

on:
  push:
    branches:
      - main
    paths-ignore:
      - version.json
      - VERSIONING.md

permissions:
  contents: write

concurrency:
  group: automatic-version-bump
  cancel-in-progress: false

jobs:
  bump-version:
    # The version-only commit is excluded above, preventing an infinite loop.
    if: "!contains(github.event.head_commit.message, '[skip-version-bump]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Calculate and write next semantic version
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'version.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const match = /^([0-9]+)\.([0-9]+)\.([0-9]+)$/.exec(data.version || '');
          if (!match) throw new Error('version.json must contain a semantic version like 1.0.0');

          let [major, minor, patch] = match.slice(1).map(Number);
          const message = process.env.COMMIT_MESSAGE || '';
          let release = 'Bug fix / maintenance release';

          if (/BREAKING CHANGE:|^[a-z]+\([^)]*\)!?:.*BREAKING CHANGE:/mi.test(message) ||
              /^[a-z]+(?:\([^)]*\))?!:/.test(message)) {
            major += 1; minor = 0; patch = 0;
            release = 'Major release';
          } else if (/^feat(?:\([^)]*\))?:/m.test(message)) {
            minor += 1; patch = 0;
            release = 'Feature release';
          } else {
            patch += 1;
          }

          data.version = `${major}.${minor}.${patch}`;
          data.release = release;
          data.updatedAt = new Date().toISOString();
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${data.version}\n`);
          NODE

      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump website version to ${{ steps.version.outputs.version }} [skip-version-bump]"
          git push origin HEAD:main
